<!doctype html>
<html><head>
  <meta charset="utf-8"><title>AEGIS — Relationship Graph</title>
  <script src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #06080f; color: #e2e8f0; margin: 0; }
    #network { width: 100%; height: 85vh; border: 1px solid rgba(71,85,105,0.3); border-radius: 1rem; background: #0c1220; }
    .panel { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #64748b; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Relationship Graph — Scan #{{ scan_id }}</h1>
    <p>Nodes sized by type; drag to explore. <a href="/">← Back to Scanner</a></p>
    <div id="network"></div>
  </div>
  <script>
    const nodes = new vis.DataSet({{ nodes | tojson }});
    const edges = new vis.DataSet({{ edges | tojson }});
    new vis.Network(document.getElementById('network'), { nodes, edges }, {
      nodes: { font: { color: '#e2e8f0', face: 'Inter' }, borderWidth: 1 },
      edges: { color: { color: '#475569', highlight: '#60a5fa' }, smooth: { type: 'continuous' } },
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000, springLength: 200 } }
    });
  </script>
</body>
</html>
